<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exibicaoDoItem.css">
    <title>Exibição do item</title>
</head>
<body>
    <div class="container-imagem">
        <img class="imagem-item" src="https://cdn.pixabay.com/photo/2019/05/31/20/49/pizza-4242967_1280.jpg">
    </div>

    <div class="info-item">
        <span class="nome-item">Mini Pizza</span>
        <p>Mini pizza de calabreza com queijo parmesão, azeitona e molho de tomate com orégano.</p>
        <span class="preco-item">R$ 00,00</span>
    </div>

    <div class="container-observacoes">
        <label for="observacoes">Observações:</label>
        <textarea id="observacoes" maxlength="150" placeholder="Adicione suas observações aqui..."></textarea>
    </div>

    <div class="container-adicionar">
        <div class="contador">
            <div>-</div>
            <span>0</span>
            <div>+</div>
        </div>
        <div class="btn-adicionar">adicionar R$ 00,00</div>
    </div>

    <footer>
        <div class="icones-footer">
            <a href="#">
                <img src="img/iconesFooter/IconeCardapio.png">
            </a>
            <a href="#">
                <img src="img/iconesFooter/IconeLupa.png">
            </a>
            <span></span>
            <a href="#">
                <img src="img/iconesFooter/IconePerfil.png">
            </a>
            <a href="#">
                <img src="img/iconesFooter/IconeCesta.png">
            </a>
        </div>
        <div class="btn-central">
            <a href="#">
                <img src="img/iconesFooter/CafeHome.png">
            </a>
        </div>
    </footer>
</body>
</html>
